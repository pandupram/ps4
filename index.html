<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PlayShe unified PS4 firmware host with per-firmware offline cache.">
<title>PlayShe Unified PS4 Host</title>
<script src="ui/firmware-config.js"></script>
<script>
(function () {
    if (location.search.indexOf("menu=1") !== -1) return;
    var firmware = window.PlaySheFirmware.detect(navigator.userAgent);
    var family = window.PlaySheFirmware.forFirmware(firmware);
    if (family) location.replace(family.cachePage);
})();
</script>
<link rel="stylesheet" href="ui/host.css">
</head>
<body>
<div id="app"></div>
<script src="ui/dashboard.js"></script>
<script src="ui/landing-app.js"></script>
</body>
</html>
