<!DOCTYPE html>
<html lang="id" manifest="cache.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYSHE — PlayStation Rental All-in-One Station</title>
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --ps-cyan: #00f0ff;
    --ps-magenta: #ff007f;
    --ps-blue: #0066ff;
    --ps-yellow: #ffe600;
    --ps-green: #00ff88;
    --bg-dark: #12141a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Background Website Serasi & Menyatu Total */
  html, body {
    background-color: var(--bg-dark) !important;
    background-image: radial-gradient(circle at 50% 12%, rgba(0, 102, 255, 0.18) 0%, transparent 60%) !important;
    background-attachment: fixed;
    color: #edf2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 8px 12px 28px;
    overflow-x: hidden;
  }

  /* ===================================================
     CONTAINER UTAMA (LEBAR & SEAMLESS)
     =================================================== */
  .container {
    width: 100%;
    max-width: 1080px;
    background: transparent !important;
    border: none;
    box-shadow: none;
    padding: 0;
    margin: 0 auto;
    text-align: center;
    position: relative;
  }

  /* ===================================================
     HEADER & LOGO BESAR (JARAK RAPAT)
     =================================================== */
  .header-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-bottom: 2px;
  }

  .logo-box {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0 0 -4px;
  }

  .logo-img {
    display: block;
    width: 98%;
    max-width: 1020px;
    height: auto;
    max-height: 520px;
    object-fit: contain;
    filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.4)) drop-shadow(0 0 60px rgba(255, 0, 127, 0.25));
    transition: transform 0.3s ease, filter 0.3s ease;
  }

  .logo-img:hover {
    transform: scale(1.015);
    filter: drop-shadow(0 0 40px rgba(0, 240, 255, 0.65)) drop-shadow(0 0 75px rgba(255, 0, 127, 0.45));
  }

  /* PlayStation Shapes (Jarak Minimalis) */
  .ps-shapes {
    font-size: 16px;
    letter-spacing: 16px;
    margin: 4px 0 10px;
    user-select: none;
  }
  .ps-triangle { color: var(--ps-green); text-shadow: 0 0 10px var(--ps-green); }
  .ps-circle   { color: var(--ps-magenta); text-shadow: 0 0 10px var(--ps-magenta); }
  .ps-cross    { color: var(--ps-cyan); text-shadow: 0 0 10px var(--ps-cyan); }
  .ps-square   { color: var(--ps-yellow); text-shadow: 0 0 10px var(--ps-yellow); }

  /* ===================================================
     FIRMWARE AUTO DETECTOR PANEL
     =================================================== */
  .detector-panel {
    background: rgba(22, 26, 36, 0.9);
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: 14px;
    padding: 12px 18px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.05);
  }

  .detector-info {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .detector-icon {
    font-size: 26px;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: rgba(0, 240, 255, 0.15);
    border: 1px solid rgba(0, 240, 255, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ps-cyan);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
  }

  .detector-text h3 {
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .detector-text p {
    font-size: 13px;
    color: #cbd5e1;
    margin-top: 2px;
  }

  .fw-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-weight: 800;
    font-size: 13px;
    background: linear-gradient(90deg, #00f0ff, #0099ff);
    color: #030814;
    letter-spacing: 0.5px;
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
  }

  .fw-tag.unknown {
    background: #475569;
    color: #ffffff;
    box-shadow: none;
  }

  .auto-action-btn {
    appearance: none;
    background: linear-gradient(135deg, #00f0ff, #ff007f);
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .auto-action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(255, 0, 127, 0.7);
    filter: brightness(1.15);
  }

  /* ===================================================
     STATUS BAR HUD
     =================================================== */
  #status-bar {
    background: rgba(18, 22, 32, 0.9);
    border: 1px solid rgba(0, 240, 255, 0.25);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 14px;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  #msgs {
    font-size: 15px;
    font-weight: 600;
    color: #e2e8f0;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
  }

  .section-tag {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #94a3b8;
    margin: 8px 0 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .section-tag::before, .section-tag::after {
    content: "";
    height: 1px;
    width: 60px;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.4), transparent);
  }

  /* ===================================================
     MENU BUTTONS & SPA PANELS
     =================================================== */
  .view-panel {
    display: none;
    width: 100%;
    animation: fadeIn 0.25s ease forwards;
  }

  .view-panel.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .menu-btn {
    appearance: none;
    background: linear-gradient(145deg, rgba(22, 28, 44, 0.95), rgba(14, 18, 30, 0.98));
    border: 1px solid rgba(0, 240, 255, 0.35);
    color: #ffffff;
    padding: 14px 12px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(0, 240, 255, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 66px;
    width: 100%;
  }

  .menu-btn small {
    font-size: 11px;
    font-weight: 500;
    color: #67e8f9;
  }

  .menu-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
    transform: skewX(-20deg);
    transition: 0.5s;
  }

  .menu-btn:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: var(--ps-cyan);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.2);
    background: linear-gradient(145deg, #0050b4, #002d6e);
  }

  .menu-btn:hover::before {
    left: 140%;
  }

  /* Highlight for Auto-Detected Firmware */
  .menu-btn.detected-match {
    border-color: var(--ps-green) !important;
    background: linear-gradient(145deg, #093826, #052217) !important;
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.55), inset 0 0 15px rgba(0, 255, 136, 0.2) !important;
    animation: pulseGlow 2s infinite;
  }

  .menu-btn.detected-match small {
    color: #86efac !important;
    font-weight: 700;
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
    50% { box-shadow: 0 0 35px rgba(0, 255, 136, 0.75); }
  }

  /* Multi FW Featured Button */
  .menu-btn-featured {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(255, 230, 0, 0.18), #241e0d);
    border: 1px solid var(--ps-yellow);
    box-shadow: 0 0 22px rgba(255, 230, 0, 0.25);
    min-height: 70px;
  }
  .menu-btn-featured span { font-size: 17px; color: #fef08a; text-shadow: 0 0 10px rgba(255, 230, 0, 0.5); }
  .menu-btn-featured small { color: #fde047; }
  .menu-btn-featured:hover {
    border-color: #ffffff;
    box-shadow: 0 0 35px rgba(255, 230, 0, 0.6);
    background: linear-gradient(135deg, #eab308, #a16207);
  }

  /* Return / Navigation Button */
  .menu-btn-back {
    grid-column: 1 / -1;
    background: linear-gradient(145deg, #332025, #1f1418);
    border-color: rgba(255, 99, 132, 0.4);
    color: #ffd6df;
  }
  .menu-btn-back:hover {
    background: linear-gradient(145deg, #c53030, #742a2a);
    border-color: #ff6b81;
    box-shadow: 0 0 25px rgba(255, 99, 132, 0.5);
    color: #ffffff;
  }

  .menu-btn-sub {
    background: rgba(28, 32, 44, 0.85);
    border-color: rgba(148, 163, 184, 0.3);
  }
  .menu-btn-sub small { color: #94a3b8; }
  .menu-btn-sub:hover {
    border-color: #cbd5e1;
    background: rgba(45, 52, 72, 0.95);
  }

  @media (max-width: 600px) {
    .logo-img { max-width: 100%; }
    .detector-panel { flex-direction: column; text-align: center; }
    .detector-info { flex-direction: column; }
    .menu-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<!-- ========================================================
     ALL-IN-ONE SINGLE PAGE LOGIC (NO REDIRECTS)
     ======================================================== -->
<script>
  // UI View Switching
  function switchView(viewId) {
    var panels = document.querySelectorAll('.view-panel');
    panels.forEach(function(p) { p.classList.remove('active'); });
    var target = document.getElementById(viewId);
    if (target) {
      target.classList.add('active');
    }
  }

  // Status message helper
  var defaultMessage = "Selamat Datang di PlayShe — Sistem rental PS siap digunakan";
  var msgElement = document.getElementById("msgs");
  window.msgs = msgElement;

  function setStatus(text) {
    if (msgElement) { msgElement.innerHTML = text; }
  }

  function resetStatus() {
    if (msgElement) { msgElement.innerHTML = defaultMessage; }
  }

  // Global Exploit Completion Callbacks (Required by 9.00 & 6.72 engines)
  function allset() {
    setStatus(window.LoadedMSG || "GoldHEN v2.4b18.12 Berhasil Dimuat ✔");
  }

  function load_poc() {
    var req = new XMLHttpRequest();
    req.responseType = "arraybuffer";
    var payloadPath = window.PLfile || "goldhen_2.4b18.12.bin";
    req.open('GET', payloadPath);
    req.send();
    req.onreadystatechange = function () {
